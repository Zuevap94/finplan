version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: finplan-db
    environment:
      - POSTGRES_DB=finplan
      - POSTGRES_USER=finplan
      - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finplan"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: finplan-backend
    environment:
      - DATABASE_URL=postgresql://finplan:${DB_PASSWORD:-changeme}@db:5432/finplan
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=false
      - CORS_ORIGINS=["https://yourdomain.ru"]
    volumes:
      - reports-data:/app/reports
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: finplan-frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  reports-data:
